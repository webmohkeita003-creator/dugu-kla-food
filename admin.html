<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dugu Kla Food — Gérant</title><link rel="stylesheet" href="style.css"></head>
<body class="adminbody"><header class="admbar"><a class="brand" href="index.html"><span class="logo">DK</span>DUGU KLA <b>FOOD</b></a><button id="logout" class="btn ghost">Déconnexion</button></header>
<main class="wrap admin"><section id="login" class="login"><p class="eyebrow wine">ESPACE GÉRANT</p><h1>Connexion</h1><form id="loginForm" class="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Mot de passe" required><button class="btn gold full">Se connecter</button></form><p id="loginMsg"></p></section>
<section id="dash" hidden><div class="adminhead"><div><p class="eyebrow wine">TABLEAU DE BORD</p><h1>Gestion Dugu Kla Food</h1></div><button id="newDish" class="btn gold">+ Ajouter un plat</button></div>
<div class="stats"><div><small>Commandes</small><b id="sOrders">0</b></div><div><small>En attente</small><b id="sPending">0</b></div><div><small>Chiffre d'affaires</small><b id="sRevenue">0</b></div><div><small>Plats</small><b id="sDishes">0</b></div></div>
<div class="panel"><div class="panelhead"><h2>Commandes</h2><button id="refresh" class="btn ghost">Actualiser</button></div><div id="orders"></div></div>
<div class="panel"><h2>Plats</h2><div id="dishes"></div></div></section></main>
<div id="dishModal" class="modal"><div class="modal-box"><button class="close" id="closeDish">×</button><p class="eyebrow wine">MENU</p><h2 id="dishTitle">Ajouter un plat</h2><form id="dishForm" class="form"><input type="hidden" name="id"><input name="name" placeholder="Nom" required><input name="category" placeholder="Catégorie" required><input name="price" type="number" placeholder="Prix FCFA" required><input name="image_url" placeholder="URL de photo"><textarea name="description" placeholder="Description"></textarea><label><input name="available" type="checkbox" checked> Disponible</label><button class="btn gold full">Enregistrer</button></form><p id="dishMsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
